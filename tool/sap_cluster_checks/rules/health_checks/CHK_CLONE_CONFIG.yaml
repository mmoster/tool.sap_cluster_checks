# CHK_CLONE_CONFIG - Validate clone resource configuration
check_id: CHK_CLONE_CONFIG
version: "1.2"
severity: CRITICAL
description: Validate SAPHana clone/promotable resource configuration
enabled: true

# For Scale-Out clusters:
# - clone-max should equal the number of HANA nodes (excluding majority maker)
# - clone-node-max should be 1 (only one instance per node)
# - interleave should be true for better failover behavior

source_definitions:
  # Get detailed clone config for SAPHana resources
  # NOTE: For sosreport analysis with stopped cluster, install 'pcs' package locally:
  #   Fedora/RHEL: dnf install pcs
  #   This enables parsing cib.xml with: pcs -f cib.xml resource config
  live_cmd: |
    echo "=== HANA_NODES ===" && \
    pcs resource config 2>/dev/null | grep -B5 -A20 'SAPHanaController' | grep -E 'clone-max|clone-node-max|interleave|promotable' | head -5 && \
    echo "=== TOPOLOGY ===" && \
    pcs resource config 2>/dev/null | grep -B5 -A10 'SAPHanaTopology' | grep -E 'clone-max|clone-node-max|interleave' | head -4 && \
    echo "=== NODE_COUNT ===" && \
    pcs status nodes 2>/dev/null | grep -c 'Online:' || echo "0"
  # Structured sos_cmd produces the same sectioned output as live_cmd
  # so parser patterns work consistently for both live and sosreport analysis
  sos_cmd: |
    echo "=== HANA_NODES ===" && \
    pcs -f {file} resource config 2>/dev/null | grep -B5 -A20 'SAPHanaController' | grep -E 'clone-max|clone-node-max|interleave|promotable' | head -5 && \
    echo "=== TOPOLOGY ===" && \
    pcs -f {file} resource config 2>/dev/null | grep -B5 -A10 'SAPHanaTopology' | grep -E 'clone-max|clone-node-max|interleave' | head -4
  sos_cmd_file: "sos_commands/pacemaker/crm_report/*/cib.xml"

parser:
  type: regex
  multiline: true
  search_patterns:
    # Both live_cmd and sos_cmd produce sectioned output with === markers
    # Controller values are in HANA_NODES section, Topology in TOPOLOGY section
    - name: controller_clone_max
      regex: "=== HANA_NODES ===[\\s\\S]*?clone-max[=\"]+(\\d+)"
      group: 1
    - name: controller_clone_node_max
      regex: "=== HANA_NODES ===[\\s\\S]*?clone-node-max[=\"]+(\\d+)"
      group: 1
    - name: controller_interleave
      regex: "=== HANA_NODES ===[\\s\\S]*?interleave[=\"]+(true|false)"
      group: 1
    - name: controller_promotable
      regex: "=== HANA_NODES ===[\\s\\S]*?promotable[=\"]+(true|false)"
      group: 1
    - name: topology_clone_max
      regex: "=== TOPOLOGY ===[\\s\\S]*?clone-max[=\"]+(\\d+)"
      group: 1
    - name: topology_clone_node_max
      regex: "=== TOPOLOGY ===[\\s\\S]*?clone-node-max[=\"]+(\\d+)"
      group: 1
    - name: topology_interleave
      regex: "=== TOPOLOGY ===[\\s\\S]*?interleave[=\"]+(true|false)"
      group: 1
    - name: saphana_resource
      # Match SAPHanaController or SAPHanaTopology by agent type or name
      regex: "(SAPHanaController|SAPHanaTopology)"
      group: 0

validation_logic:
  scope: cluster  # Clone config is cluster-wide
  custom_check: clone_max_validation
  expectations:
    - key: saphana_resource
      operator: exists
      value: true
      message: "No SAPHana clone/promotable resource found"
    - key: controller_clone_node_max
      operator: equals
      value: "1"
      message: "SAPHanaController clone-node-max should be 1"
    - key: controller_interleave
      operator: equals
      value: "true"
      message: "SAPHanaController interleave should be true"
    - key: controller_promotable
      operator: equals
      value: "true"
      message: "SAPHanaController should be promotable (master/slave)"
    - key: topology_clone_node_max
      operator: equals
      value: "1"
      message: "SAPHanaTopology clone-node-max should be 1"
    - key: topology_interleave
      operator: equals
      value: "true"
      message: "SAPHanaTopology interleave should be true"
