# CHK_NODE_STATUS - Verify all cluster nodes are online
check_id: CHK_NODE_STATUS
version: "1.0"
severity: CRITICAL
description: Verify all cluster nodes are online and active
enabled: true

source_definitions:
  live_cmd: |
    OUTPUT=$(crm_mon -1 -r 2>/dev/null || pcs status nodes 2>/dev/null)
    echo "$OUTPUT"
    STANDBY=$(echo "$OUTPUT" | sed -n 's/.*Standby:\s*\[\s*\(.*\)\s*\].*/\1/p')
    if [ -z "$STANDBY" ]; then
      STANDBY=$(echo "$OUTPUT" | sed -n 's/.*Node\s\+\(\S\+\):\s*standby.*/\1/Ip' | tr '\n' ' ')
    fi
    STANDBY=$(echo "$STANDBY" | xargs)
    if [ -n "$STANDBY" ]; then
      echo "STANDBY_NODE_LIST=$(echo $STANDBY | tr ' ' ',')"
    fi
  sos_path: "sos_commands/pacemaker/crm_mon_-1*"
  # Fallback: run pcs -f cib.xml locally when cluster was stopped
  sos_cmd: "pcs -f {file} status nodes 2>/dev/null"
  sos_cmd_file: "sos_commands/pacemaker/crm_report/*/cib.xml"

parser:
  type: regex
  multiline: true
  search_patterns:
    - name: offline_nodes
      regex: "(OFFLINE|Offline:.*\\S)"
      group: 0
    - name: standby_nodes
      regex: "(standby|Standby:.*\\S)"
      group: 0
    - name: online_nodes
      regex: "(Online|online)"
      group: 0
    - name: standby_node_list
      regex: "STANDBY_NODE_LIST=(.*)"
      group: 1

validation_logic:
  scope: cluster  # Cluster-wide status, only needs one node
  expectations:
    - key: offline_nodes
      operator: not_exists
      value: true
      message: "One or more cluster nodes are OFFLINE"
    - key: online_nodes
      operator: exists
      value: true
      message: "No online nodes found - cluster may be down"
