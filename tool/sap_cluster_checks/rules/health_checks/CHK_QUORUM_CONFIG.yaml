# CHK_QUORUM_CONFIG - Validate quorum configuration
#
# Applies to ALL cluster topologies (Scale-Up and Scale-Out).
# Scale-Up typically uses two_node: 1; Scale-Out uses expected_votes
# matching the node count. A quorum device (qdevice/qnetd) may be
# present in either topology to provide an additional vote.
#
check_id: CHK_QUORUM_CONFIG
version: "1.1"
severity: CRITICAL
description: Validate quorum configuration
enabled: true

source_definitions:
  live_cmd: "cat /etc/corosync/corosync.conf 2>/dev/null || corosync-quorumtool -s 2>/dev/null | head -20"
  sos_path: "etc/corosync/corosync.conf"

parser:
  type: regex
  multiline: true
  search_patterns:
    - name: two_node
      regex: "two_node:\\s*1"
      group: 0
    - name: wait_for_all
      regex: "wait_for_all:\\s*[01]"
      group: 0
    - name: expected_votes
      regex: "(expected_votes|Expected votes)[:\\s]+\\d+"
      group: 0
    - name: quorum_section
      regex: "quorum\\s*\\{"
      group: 0
    - name: qdevice
      # Detect quorum device configuration (device { model: net ... })
      regex: "(device\\s*\\{)"
      group: 0

validation_logic:
  scope: all_nodes_equal  # Config should be same on all nodes
  compare_keys:
    - two_node
    - expected_votes
  expectations:
    - key: quorum_section
      operator: exists
      value: true
      message: "No quorum section found in corosync.conf"
    - key: two_node
      operator: info_if_exists
      pass_message: "Quorum: ${two_node}"
    - key: expected_votes
      operator: info_if_exists
      pass_message: "Quorum: ${expected_votes}"
    - key: wait_for_all
      operator: info_if_exists
      pass_message: "Quorum: ${wait_for_all}"
    - key: qdevice
      operator: info_if_exists
      pass_message: "Quorum device (qdevice) configured"
