# CHK_PROMOTED_ROLES - Verify promoted/unpromoted role consistency
check_id: CHK_PROMOTED_ROLES
version: "1.1"
severity: CRITICAL
description: Verify exactly one promoted and one unpromoted instance in HANA cluster
enabled: true

source_definitions:
  live_cmd: "crm_mon -1 2>/dev/null | grep -E 'Master|Slave|Promoted|Unpromoted' || SAPHanaSR-showAttr 2>/dev/null | grep -E 'roles|master'"
  sos_path: "sos_commands/pacemaker/crm_mon_-1*"
  # Fallback: run pcs -f cib.xml locally when cluster was stopped
  sos_cmd: "pcs -f {file} status 2>/dev/null | grep -E 'Master|Slave|Promoted|Unpromoted'"
  sos_cmd_file: "sos_commands/pacemaker/crm_report/*/cib.xml"

parser:
  type: regex
  multiline: true
  search_patterns:
    - name: promoted_count
      # Match: "Masters: [ node ]", "Promoted: [ node ]", "Promoted node", "PROMOTED"
      # Use [ \t] instead of \s to avoid crossing newlines in per-node crm_mon format
      regex: "(Masters:[ \t]*\\[|Promoted:[ \t]*\\[|Promoted[ \t]+\\S|PROMOTED)"
      group: 0
    - name: unpromoted_count
      # Match: "Slaves: [ node ]", "Unpromoted: [ node ]", "Unpromoted node", "DEMOTED"
      regex: "(Slaves:[ \t]*\\[|Unpromoted:[ \t]*\\[|Unpromoted[ \t]+\\S|DEMOTED)"
      group: 0
    - name: no_role
      regex: "(Stopped|no role|unknown)"
      group: 0

validation_logic:
  scope: cluster  # Role distribution is cluster-wide
  expectations:
    - key: promoted_count
      operator: exists
      value: true
      message: "No promoted instance found"
    - key: unpromoted_count
      operator: exists
      value: true
      message: "No unpromoted instance found - no failover target"
